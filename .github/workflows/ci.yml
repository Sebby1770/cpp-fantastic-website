name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y cmake g++ curl
      - name: Configure and build
        run: cmake -S . -B build && cmake --build build
      - name: Unit tests
        run: ./build/aster_unit_tests
      - name: Smoke
        run: ./tests/smoke.sh
